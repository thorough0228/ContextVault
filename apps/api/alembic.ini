# Alembic configuration for contextvault-api.
# Migrations live in `alembic/versions/`. The connection URL is
# injected by `alembic/env.py` from `app.config.Settings`, so there's
# no need to set sqlalchemy.url here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Suppress noisy SQL echo unless explicitly enabled via env var.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S